<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-image: url('./background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    
    .card {
      background: rgba(15, 15, 17, 0.7);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.5rem;
    }
    
    .task-card {
      background: rgba(30, 30, 35, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 0.375rem;
      padding: 0.5rem;
    }
    
    .glow-inbox { box-shadow: 0 0 12px rgba(59, 130, 246, 0.3); }
    .glow-assigned { box-shadow: 0 0 12px rgba(168, 85, 247, 0.3); }
    .glow-progress { box-shadow: 0 0 12px rgba(249, 115, 22, 0.3); }
    .glow-review { box-shadow: 0 0 12px rgba(234, 179, 8, 0.3); }
    .glow-done { box-shadow: 0 0 12px rgba(34, 197, 94, 0.3); }
    
    .dot-online { background-color: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.8); }
    .dot-busy { background-color: #ef4444; }
    .dot-away { background-color: #6b7280; }
    
    .status-online { background-color: #22c55e; box-shadow: 0 0 8px rgba(0, 229, 255, 0.8); }
    
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 11, 0.5);
      z-index: 0;
    }
    
    .bar-inbox { background-color: #3b82f6; }
    .bar-assigned { background-color: #a855f7; }
    .bar-progress { background-color: #f97316; }
    .bar-review { background-color: #eab308; }
    .bar-done { background-color: #22c55e; }
    
    .dot-inbox { background-color: #3b82f6; }
    .dot-assigned { background-color: #a855f7; }
    .dot-progress { background-color: #f97316; }
    .dot-review { background-color: #eab308; }
    .dot-done { background-color: #22c55e; }
  </style>
</head>
<body class="h-screen text-sm font-sans relative overflow-hidden">
  <div class="overlay"></div>
  
  <div class="flex h-screen p-2 gap-5 relative z-10">
    <!-- LEFT SIDEBAR -->
    <div class="w-16 card m-2 flex flex-col items-center py-4">
      <div class="w-8 h-8 bg-gradient-to-br from-cyan-400 to-blue-500 rounded flex items-center justify-center text-white font-bold text-sm mb-6">N</div>
      
      <div class="mb-6">
        <div class="text-[8px] text-gray-400 text-center mb-1">JARVIS</div>
        <div class="flex items-center gap-1">
          <span class="w-2 h-2 status-online rounded-full animate-pulse"></span>
          <span class="text-[8px] text-cyan-400 font-mono">ONLINE</span>
        </div>
      </div>
      
      <div class="mb-4">
        <div class="text-[8px] text-gray-500 text-center mb-2">HUMAN</div>
        <div class="flex flex-col items-center gap-1">
          <span class="w-2 h-2 dot-online rounded-full"></span>
          <span class="text-white text-[8px]">K3n</span>
        </div>
      </div>
      
      <div class="flex-1">
        <div class="text-[8px] text-gray-500 text-center mb-2">AGENTS</div>
        <div class="flex flex-col items-center gap-2">
          <div class="flex flex-col items-center gap-1">
            <span class="w-2 h-2 dot-online rounded-full"></span>
            <span class="text-white text-[8px]">JARVIS</span>
          </div>
          <div class="flex flex-col items-center gap-1">
            <span class="w-2 h-2 dot-busy rounded-full"></span>
            <span class="text-white text-[8px]">BLAZE</span>
          </div>
          <div class="flex flex-col items-center gap-1">
            <span class="w-2 h-2 dot-online rounded-full"></span>
            <span class="text-white text-[8px]">NOVA</span>
          </div>
          <div class="flex flex-col items-center gap-1">
            <span class="w-2 h-2 dot-online rounded-full"></span>
            <span class="text-white text-[8px]">SAGE</span>
          </div>
          <div class="flex flex-col items-center gap-1">
            <span class="w-2 h-2 dot-away rounded-full"></span>
            <span class="text-white text-[8px]">AXEL</span>
          </div>
        </div>
      </div>
    </div>
    
    <!-- MAIN CONTENT - KANBAN (No container around tiles) -->
    <div class="flex-1 flex p-2 gap-5 overflow-hidden z-10" id="kanban">
      <!-- Columns rendered by JS -->
    </div>
    
    <!-- RIGHT SIDEBAR -->
    <div class="w-48 card m-2 p-4">
      <div class="text-gray-400 text-[10px] font-bold mb-4 flex items-center gap-2">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
        SCHEDULED
      </div>
      
      <div class="space-y-4" id="jobs">
        <!-- Jobs rendered by JS -->
      </div>
      
      <div class="mt-auto pt-4 border-t border-white/10">
        <div class="text-[8px] text-gray-500 text-center">
          MISSION CONTROL<br>
          <span class="text-cyan-400">© 2026</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const columns = [
      { name: "INBOX", count: 3, class: "glow-inbox", bar: "bar-inbox", dot: "dot-inbox" },
      { name: "ASSIGNED", count: 2, class: "glow-assigned", bar: "bar-assigned", dot: "dot-assigned" },
      { name: "IN PROGRESS", count: 3, class: "glow-progress", bar: "bar-progress", dot: "dot-progress" },
      { name: "REVIEW", count: 1, class: "glow-review", bar: "bar-review", dot: "dot-review" },
      { name: "DONE", count: 3, class: "glow-done", bar: "bar-done", dot: "dot-done" }
    ];
    
    const tasks = {
      "INBOX": [
        { id: "1", title: "Upgrade Protocols", tags: ["comm", "enc"] },
        { id: "2", title: "Q2 Revenue Reports", tags: ["finance"] },
        { id: "3", title: "Security Patches", tags: ["security"] }
      ],
      "ASSIGNED": [
        { id: "4", title: "Reinforce Firewall", tags: ["security"], assignee: "JARVIS" },
        { id: "5", title: "Analytics Dashboard", tags: ["frontend"], assignee: "AXEL" }
      ],
      "IN PROGRESS": [
        { id: "6", title: "CRITICAL: Breach", tags: ["security"], assignee: "BLAZE" },
        { id: "7", title: "Neural Upgrade", tags: ["ai"], assignee: "NOVA" },
        { id: "8", title: "DB Optimization", tags: ["backend"], assignee: "JARVIS" }
      ],
      "REVIEW": [
        { id: "9", title: "System Audit", tags: ["security"], assignee: "SAGE" }
      ],
      "DONE": [
        { id: "10", title: "Network Map", tags: ["infra"] },
        { id: "11", title: "Agent Manual", tags: ["docs"] },
        { id: "12", title: "API Gateway", tags: ["backend"] }
      ]
    };
    
    const scheduledJobs = [
      { name: "Memory Sync", freq: "5 min", progress: 100, color: "#00E5FF" },
      { name: "GitHub Backup", freq: "1 hour", progress: 100, color: "#00E5FF" },
      { name: "Email Check", freq: "30 min", progress: 100, color: "#00E5FF" },
      { name: "Health Check", freq: "10 min", progress: 98, color: "#FF8A00" }
    ];
    
    // Render Kanban Columns - NO container around tiles
    const kanbanEl = document.getElementById('kanban');
    columns.forEach(col => {
      const colDiv = document.createElement('div');
      colDiv.className = 'flex-1 min-w-0 flex flex-col';
      colDiv.innerHTML = `
        <div class="flex items-center gap-2 mb-2">
          <div class="w-1 h-4 ${col.bar} rounded-full"></div>
          <span class="text-white font-semibold text-xs">${col.name}</span>
          <span class="text-gray-400 text-xs">${col.count}</span>
        </div>
        <div class="flex-1 space-y-2 overflow-y-auto">
          ${tasks[col.name].map(task => `
            <div class="task-card ${col.class}">
              <div class="flex items-center gap-1.5 mb-1">
                <span class="w-1.5 h-1.5 rounded-full ${col.dot}"></span>
                ${task.assignee ? `<span class="text-cyan-400 text-[10px] font-mono">${task.assignee}</span>` : ''}
              </div>
              <p class="text-white text-xs font-medium truncate">${task.title}</p>
              ${task.tags ? `<div class="flex gap-1 mt-1">${task.tags.map(t => `<span class="text-[8px] bg-white/5 text-gray-400 px-1.5 py-0.5 rounded">${t}</span>`).join('')}</div>` : ''}
            </div>
          `).join('')}
        </div>
      `;
      kanbanEl.appendChild(colDiv);
    });
    
    // Render Scheduled Jobs
    const jobsEl = document.getElementById('jobs');
    scheduledJobs.forEach(job => {
      const radius = 16;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (job.progress / 100) * circumference;
      
      const jobDiv = document.createElement('div');
      jobDiv.className = 'flex items-center justify-between';
      jobDiv.innerHTML = `
        <div>
          <p class="text-white text-xs">${job.name}</p>
          <p class="text-gray-500 text-[8px]">${job.freq}</p>
        </div>
        <div class="relative w-8 h-8">
          <svg class="w-8 h-8 -rotate-90">
            <circle cx="16" cy="16" r="${radius}" stroke="rgba(255,255,255,0.1)" stroke-width="3" fill="none" />
            <circle cx="16" cy="16" r="${radius}" stroke="${job.color}" stroke-width="3" fill="none" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round" />
          </svg>
          <span class="absolute inset-0 flex items-center justify-center text-[8px] text-white font-mono">${job.progress}%</span>
        </div>
      `;
      jobsEl.appendChild(jobDiv);
    });
  </script>
</body>
</html>
