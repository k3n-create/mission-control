<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Control</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0a0a0b; background-image: url('https://images.unsplash.com/photo-1464039397811-e7aec7d3a299?auto=format&fit=crop&w=1920&q=80'); background-size: cover; background-position: center; min-height: 100vh; }
    .glass { background: rgba(15, 15, 17, 0.85); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .card { background: rgba(30, 30, 35, 0.9); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 0.5rem; transition: all 0.2s; }
    .card:hover { transform: translateY(-2px); border-color: rgba(6, 182, 212, 0.3); }
    .card.dragging { opacity: 0.5; border: 1px dashed #22d3ee; }
    .columns-container { display: flex; gap: 1.25rem; overflow-x: auto; height: 100%; }
    .column { flex: 1; min-width: 300px; display: flex; flex-direction: column; }
    .column-body { flex: 1; min-height: 150px; }
    .tag-pill { background: rgba(255, 255, 255, 0.05); color: #94a3b8; font-size: 0.65rem; padding: 0.15rem 0.4rem; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.1); }
    .agent-badge { background: rgba(6, 182, 212, 0.15); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.3); font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 0.25rem; text-transform: uppercase; }
    .modal-backdrop { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px); }
  </style>
</head>
<body class="text-gray-200">
  <header class="glass p-4 flex justify-between items-center sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-cyan-600 rounded flex items-center justify-center font-bold text-black">J</div>
      <div>
        <h1 class="text-xl font-bold text-white">MISSION CONTROL</h1>
        <p class="text-[10px] text-cyan-500 font-mono tracking-widest uppercase">System Live</p>
      </div>
    </div>
  </header>

  <main class="p-6 h-[calc(100vh-88px)]">
    <div id="board" class="columns-container h-full"></div>
  </main>

  <div id="editModal" class="fixed inset-0 modal-backdrop hidden items-center justify-center z-50">
    <div class="glass rounded-xl p-8 w-[520px] max-w-full shadow-2xl">
      <h2 class="text-xl font-bold text-white mb-2">Task Protocol</h2>
      <p class="text-[10px] text-gray-500 mb-6 tracking-widest uppercase">Manual Override Active</p>
      <input type="hidden" id="editTaskId">
      <div class="space-y-5">
        <div>
          <label class="block text-[10px] text-cyan-500 font-bold mb-1.5 uppercase">Title</label>
          <input type="text" id="editTitle" class="w-full bg-black/40 border border-white/10 rounded-md p-3 text-sm outline-none focus:border-cyan-500">
        </div>
        <div>
          <label class="block text-[10px] text-cyan-500 font-bold mb-1.5 uppercase">Description</label>
          <textarea id="editDescription" rows="4" class="w-full bg-black/40 border border-white/10 rounded-md p-3 text-sm outline-none focus:border-cyan-500"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] text-cyan-500 font-bold mb-1.5 uppercase">Assign Asset</label>
            <select id="editAssignedTo" class="w-full bg-black/40 border border-white/10 rounded-md p-3 text-sm outline-none">
              <option value="">None</option>
              <option value="JARVIS">JARVIS</option>
              <option value="JADE">JADE</option>
              <option value="K3n">K3n</option>
            </select>
          </div>
          <div>
            <label class="block text-[10px] text-cyan-500 font-bold mb-1.5 uppercase">Tags (comma-separated)</label>
            <input type="text" id="editTags" class="w-full bg-black/40 border border-white/10 rounded-md p-3 text-sm outline-none" placeholder="tag1, tag2">
          </div>
        </div>
      </div>
      <div class="flex justify-between mt-10">
        <button onclick="deleteTask()" class="text-red-500 text-[11px] font-bold tracking-widest hover:text-red-400">TERMINATE</button>
        <div class="flex gap-4">
          <button onclick="closeEditModal()" class="text-gray-400 text-sm">Exit</button>
          <button onclick="saveTaskEdit()" class="bg-cyan-600 px-6 py-2 rounded text-sm font-bold shadow-lg hover:bg-cyan-500">UPDATE SYSTEM</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_COLUMNS = ['todo', 'assigned', 'in_progress', 'review', 'done'];
    const displayNames = { 'todo': 'INBOX', 'assigned': 'ASSIGNED', 'in_progress': 'IN PROGRESS', 'review': 'REVIEW', 'done': 'DONE' };
    let tasks = [];
    let columnNames = [...DEFAULT_COLUMNS];

    function initRealtime() {
      const supabaseUrl = 'https://ljoiifswtizxhtwtilkf.supabase.co';
      const supabaseKey = 'sb_publishable_wICRlh3baVhWG9Lqw4u1Zg_ADbfIMtm';
      if (!window.supabase) return;
      const client = window.supabase.createClient(supabaseUrl, supabaseKey);
      client.channel('tasks-channel').on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, (payload) => {
          // Silent background sync
          fetchTasksSilently(); 
      }).subscribe();
    }

    async function fetchTasksSilently() {
      const res = await fetch('/api/tasks');
      const data = await res.json();
      tasks = Object.keys(data).flatMap(col => data[col].map(t => ({
        ...t, id: t.id.toString(), column: col.toLowerCase(), assignedTo: t.assigned_agent || '', task_name: t.task_name || t.content || 'Untitled'
      })));
      renderBoard();
    }

    async function init() {
      await fetchTasksSilently();
      initRealtime();
    }

    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = columnNames.map(col => `
        <div class="column glass rounded-lg p-4">
          <div class="flex justify-between items-center mb-5 border-b border-white/5 pb-3">
            <div class="flex-1"></div>
            <div class="flex flex-col items-center">
              <h3 class="text-[10px] font-bold tracking-[0.3em] text-cyan-500 uppercase">${displayNames[col] || col}</h3>
              <span class="text-[9px] font-mono text-gray-500 mt-1">UNITS: ${tasks.filter(t => t.column === col).length}</span>
            </div>
            <div class="flex-1 flex justify-end">
              <button onclick="createNewTask('${col}')" class="text-gray-400 hover:text-white font-bold text-lg">+</button>
            </div>
          </div>
          <div class="column-body space-y-3" data-column="${col}" ondragover="allowDrop(event)" ondrop="drop(event)">
            ${tasks.filter(t => t.column === col).map(t => `
              <div class="card p-4 cursor-grab mb-3" draggable="true" ondragstart="drag(event)" data-id="${t.id}" onclick="openEditModal('${t.id}')">
                ${t.assignedTo ? `<span class="agent-badge mb-2 block w-fit">${t.assignedTo}</span>` : ''}
                <div class="text-sm font-semibold text-gray-100">${escapeHtml(t.task_name)}</div>
                <div class="flex flex-wrap gap-1 mt-2">${(t.tags || []).map(tag => `<span class="tag-pill">${tag}</span>`).join('')}</div>
                ${t.description ? `<div class="text-[10px] text-gray-500 line-clamp-2 mt-2">${escapeHtml(t.description)}</div>` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function allowDrop(e) { e.preventDefault(); }
    function drag(e) { e.dataTransfer.setData("text", e.target.dataset.id); }
    
    async function drop(e) {
      e.preventDefault();
      const id = e.dataTransfer.getData("text");
      const columnBody = e.target.closest('.column-body');
      if (!columnBody) return;
      const newCol = columnBody.dataset.column;
      const task = tasks.find(t => t.id === id);
      if (task && task.column !== newCol) {
        task.column = newCol;
        renderBoard(); // UI Updates Instantly
        await saveToServer();
      }
    }

    async function createNewTask(col) {
      const newTask = { id: Date.now().toString(), task_name: 'NEW_OBJECTIVE', column: col, description: '', assignedTo: '', tags: [] };
      tasks.push(newTask);
      renderBoard();
      await saveToServer();
      openEditModal(newTask.id);
    }

    async function saveToServer() {
      const payload = tasks.map(t => ({ ...t, content: t.task_name, assigned_agent: t.assignedTo }));
      await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tasks: payload, columns: columnNames })
      });
    }

    function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    
    function openEditModal(id) {
      const t = tasks.find(task => task.id === id);
      if (!t) return;
      document.getElementById('editTaskId').value = t.id;
      document.getElementById('editTitle').value = t.task_name;
      document.getElementById('editDescription').value = t.description || '';
      document.getElementById('editAssignedTo').value = t.assignedTo || '';
      document.getElementById('editTags').value = (t.tags || []).join(', ');
      document.getElementById('editModal').classList.replace('hidden', 'flex');
    }

    function closeEditModal() { document.getElementById('editModal').classList.replace('flex', 'hidden'); }

    async function saveTaskEdit() {
      const id = document.getElementById('editTaskId').value;
      const t = tasks.find(task => task.id === id);
      if (t) {
        t.task_name = document.getElementById('editTitle').value.trim();
        t.description = document.getElementById('editDescription').value.trim();
        t.assignedTo = document.getElementById('editAssignedTo').value;
        t.tags = document.getElementById('editTags').value.split(',').map(tag => tag.trim()).filter(tag => tag);
        renderBoard(); // Update UI First
        await saveToServer(); // Save to Background
      }
      closeEditModal();
    }

    async function deleteTask() {
      const id = document.getElementById('editTaskId').value;
      if (confirm("STRICT_TERMINATE: Permanently delete this objective?")) {
        tasks = tasks.filter(t => t.id !== id);
        renderBoard();
        await saveToServer();
        closeEditModal();
      }
    }

    window.onload = init;
  </script>
</body>
</html>
