<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Control</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Removed the Unsplash image to bypass CORB blocking permanently */
    body { font-family: 'Inter', sans-serif; background-color: #0a0a0b; min-height: 100vh; margin: 0; }
    .glass { background: rgba(15, 15, 17, 0.90); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(16px); }
    .card { background: rgba(30, 30, 35, 1); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 0.5rem; transition: transform 0.2s, border-color 0.2s; cursor: pointer; }
    .card:hover { transform: translateY(-2px); border-color: rgba(6, 182, 212, 0.5); }
    .card.dragging { opacity: 0.5; border: 1px dashed #22d3ee; }
    .columns-container { display: flex; gap: 1.25rem; overflow-x: auto; height: 100%; padding-bottom: 20px; }
    .column { flex: 1; min-width: 280px; display: flex; flex-direction: column; }
    .tag-pill { background: rgba(255, 255, 255, 0.1); color: #94a3b8; font-size: 0.65rem; padding: 0.15rem 0.4rem; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.1); }
    .agent-badge { background: rgba(6, 182, 212, 0.15); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.3); font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 0.25rem; text-transform: uppercase; }
    .modal-backdrop { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px); }
  </style>
</head>
<body class="text-gray-200">
  <header class="glass p-4 flex justify-between items-center sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-cyan-600 rounded flex items-center justify-center font-bold text-black">J</div>
      <div>
        <h1 class="text-xl font-bold text-white">MISSION CONTROL</h1>
        <p class="text-[10px] text-cyan-500 font-mono tracking-widest uppercase">System Direct-Link Online</p>
      </div>
    </div>
  </header>

  <main class="p-6 h-[calc(100vh-88px)]">
    <div id="board" class="columns-container h-full"></div>
  </main>

  <div id="editModal" class="fixed inset-0 modal-backdrop hidden items-center justify-center z-50">
    <div class="glass rounded-xl p-8 w-[520px] max-w-full shadow-2xl">
      <h2 class="text-xl font-bold text-white mb-2">Task Protocol</h2>
      <input type="hidden" id="editTaskId">
      <div class="space-y-5">
        <input type="text" id="editTitle" class="w-full bg-black/40 border border-white/10 rounded-md p-3 text-sm focus:border-cyan-500 outline-none" placeholder="Objective Title">
        <textarea id="editDescription" rows="4" class="w-full bg-black/40 border border-white/10 rounded-md p-3 text-sm focus:border-cyan-500 outline-none" placeholder="Details"></textarea>
        <div class="grid grid-cols-2 gap-4">
          <select id="editAssignedTo" class="w-full bg-black/40 border border-white/10 rounded-md p-3 text-sm outline-none">
            <option value="">Assign Asset</option><option value="JARVIS">JARVIS</option><option value="JADE">JADE</option><option value="K3n">K3n</option>
          </select>
          <input type="text" id="editTags" class="w-full bg-black/40 border border-white/10 rounded-md p-3 text-sm outline-none" placeholder="tag1, tag2">
        </div>
      </div>
      <div class="flex justify-between mt-10">
        <button onclick="deleteTask()" class="text-red-500 text-[11px] font-bold tracking-widest hover:text-red-400 uppercase">Terminate</button>
        <div class="flex gap-4">
          <button onclick="closeEditModal()" class="text-gray-400 text-sm">Exit</button>
          <button onclick="saveTaskEdit()" class="bg-cyan-600 px-6 py-2 rounded text-sm font-bold shadow-lg hover:bg-cyan-500">PUSH TRUTH</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_COLUMNS = ['todo', 'assigned', 'in_progress', 'review', 'done'];
    const displayNames = { 'todo': 'INBOX', 'assigned': 'ASSIGNED', 'in_progress': 'IN PROGRESS', 'review': 'REVIEW', 'done': 'DONE' };
    const supabaseUrl = 'https://ljoiifswtizxhtwtilkf.supabase.co';
    const supabaseKey = 'sb_publishable_wICRlh3baVhWG9Lqw4u1Zg_ADbfIMtm';

    let supabase, tasks = [], manualLock = false;

    function renderBoard() {
      const board = document.getElementById('board');
      if (!board) return;
      board.innerHTML = DEFAULT_COLUMNS.map(col => `
        <div class="column glass rounded-lg p-4">
          <div class="flex justify-between items-center mb-5 border-b border-white/5 pb-3">
            <h3 class="text-[10px] font-bold tracking-[0.3em] text-cyan-500 uppercase">${displayNames[col]}</h3>
            <button onclick="createNewTask('${col}')" class="text-gray-400 hover:text-white font-bold text-lg">+</button>
          </div>
          <div class="column-body space-y-3 flex-1 min-h-[200px]" id="col-${col}" ondragover="allowDrop(event)" ondrop="drop(event)">
            ${tasks.filter(t => t.column === col).map(t => `
              <div class="card p-4 mb-3" draggable="true" ondragstart="drag(event)" data-id="${t.id}" onclick="openEditModal('${t.id}')">
                ${t.assignedTo ? `<span class="agent-badge mb-2 block w-fit">${t.assignedTo}</span>` : ''}
                <div class="text-sm font-semibold text-gray-100">${escapeHtml(t.task_name)}</div>
                <div class="flex flex-wrap gap-1 mt-2">${(t.tags || []).map(tag => `<span class="tag-pill">${tag}</span>`).join('')}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    async function init() {
      renderBoard();
      try {
        if (!window.supabase) {
            console.error("Supabase SDK Missing");
            return;
        }
        supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const { data, error } = await supabase.from('tasks').select('*');
        if (error) throw error;

        tasks = data.map(t => ({
          id: t.id.toString(), column: (t.status || 'todo').toLowerCase(),
          assignedTo: t.assigned_agent || '', task_name: t.content || 'Untitled',
          description: t.description || '', tags: t.tags || []
        }));

        renderBoard();

        supabase.channel('tasks-channel').on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, () => {
            if (!manualLock) fetchLatest();
        }).subscribe();
      } catch (e) { console.error("INIT ERROR", e); }
    }

    async function fetchLatest() {
        try {
            const { data, error } = await supabase.from('tasks').select('*');
            if (!error && data) {
                tasks = data.map(t => ({
                  id: t.id.toString(), column: (t.status || 'todo').toLowerCase(),
                  assignedTo: t.assigned_agent || '', task_name: t.content || 'Untitled',
                  description: t.description || '', tags: t.tags || []
                }));
                renderBoard();
            }
        } catch(e) {}
    }

    function allowDrop(e) { e.preventDefault(); }
    
    function drag(e) { 
        e.dataTransfer.setData("text", e.target.dataset.id); 
        e.target.classList.add('dragging');
    }
    
    async function drop(e) {
      e.preventDefault();
      const id = e.dataTransfer.getData("text");
      const columnBody = e.target.closest('.column-body');
      if (!columnBody) return;
      
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.column = columnBody.id.replace('col-', '');
        renderBoard();
        await pushTruth(task);
      }
    }

    async function createNewTask(col) {
      const newTask = { id: Date.now().toString(), task_name: 'NEW_OBJECTIVE', column: col, description: '', assignedTo: '', tags: [] };
      tasks.push(newTask);
      renderBoard();
      await pushTruth(newTask);
      openEditModal(newTask.id);
    }

    async function pushTruth(task) {
      manualLock = true;
      try {
        if (task && supabase) {
          await supabase.from('tasks').upsert({
              id: task.id, content: task.task_name, assigned_agent: task.assignedTo,
              status: task.column, description: task.description, tags: task.tags
          });
        }
        fetch('/api/tasks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tasks: tasks.map(t => ({ ...t, content: t.task_name, assigned_agent: t.assignedTo, status: t.column })), columns: DEFAULT_COLUMNS }) }).catch(e => console.log('Railway sync skipped'));
        setTimeout(() => manualLock = false, 3000);
      } catch (e) { manualLock = false; }
    }

    function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    
    function openEditModal(id) {
      const t = tasks.find(task => task.id === id); if (!t) return;
      document.getElementById('editTaskId').value = t.id;
      document.getElementById('editTitle').value = t.task_name;
      document.getElementById('editDescription').value = t.description;
      document.getElementById('editAssignedTo').value = t.assignedTo;
      document.getElementById('editTags').value = (t.tags || []).join(', ');
      
      const modal = document.getElementById('editModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }
    
    function closeEditModal() { 
        const modal = document.getElementById('editModal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }

    async function saveTaskEdit() {
      const id = document.getElementById('editTaskId').value, t = tasks.find(task => task.id === id);
      if (t) {
        t.task_name = document.getElementById('editTitle').value;
        t.description = document.getElementById('editDescription').value;
        t.assignedTo = document.getElementById('editAssignedTo').value;
        t.tags = document.getElementById('editTags').value.split(',').map(tag => tag.trim()).filter(tag => tag);
        renderBoard(); await pushTruth(t);
      }
      closeEditModal();
    }

    async function deleteTask() {
      const id = document.getElementById('editTaskId').value;
      if (confirm("TERMINATE MISSION?")) {
        if (supabase) await supabase.from('tasks').delete().eq('id', id);
        tasks = tasks.filter(t => t.id !== id);
        renderBoard(); closeEditModal();
      }
    }

    // FIRE IMMEDIATELY (Bypassing the 'DOMContentLoaded' trap)
    init();
  </script>
</body>
</html>
