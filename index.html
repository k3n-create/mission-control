<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Mission Control</title>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 <script src="https://cdn.tailwindcss.com"></script>
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
 <style>
 body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0a0a0b 0%, #111827 100%); min-height: 100vh; color: #f8fafc; margin: 0; }
 .glass { background: rgba(15, 15, 17, 0.90); border: 1px solid rgba(255, 255, 255, 0.08); padding: 1rem; }
 .card { background: rgba(30, 30, 35, 1); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 0.5rem; transition: transform 0.2s; cursor: pointer; padding: 1rem; margin-bottom: 0.75rem; }
 .card:hover { transform: translateY(-2px); border-color: rgba(6, 182, 212, 0.5); }
 .columns-container { display: flex; gap: 1.25rem; overflow-x: auto; height: calc(100vh - 100px); padding: 1.5rem; align-items: flex-start; }
 .column { flex: 1; min-width: 280px; display: flex; flex-direction: column; height: auto; }
 .tag-pill { background: rgba(255, 255, 255, 0.1); color: #94a3b8; font-size: 0.65rem; padding: 0.15rem 0.4rem; border-radius: 4px; margin-right: 4px; }
 .agent-badge { background: rgba(6, 182, 212, 0.15); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.3); font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 0.25rem; text-transform: uppercase; margin-bottom: 8px; display: inline-block; }
 .modal-backdrop { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; }
 </style>
</head>
<body>
 <header class="glass p-4 flex justify-between items-center sticky top-0 z-40">
 <div class="flex items-center gap-3">
 <div class="w-10 h-10 bg-cyan-600 rounded flex items-center justify-center font-bold text-black">J</div>
 <h1 class="text-xl font-bold">MISSION CONTROL</h1>
 </div>
 </header>
 <main id="board" class="columns-container"></main>

 <div id="editModal" class="modal-backdrop">
 <div class="glass rounded-xl p-8 w-[520px] max-w-[90%] shadow-2xl">
 <h2 class="text-xl font-bold mb-4">Task Protocol</h2>
 <input type="hidden" id="editTaskId">
 <div class="space-y-4">
 <input type="text" id="editTitle" class="w-full bg-black/40 border border-white/10 rounded p-3 text-white" placeholder="Title">
 <textarea id="editDescription" rows="4" class="w-full bg-black/40 border border-white/10 rounded p-3 text-white" placeholder="Details"></textarea>
 <div class="grid grid-cols-2 gap-4">
 <select id="editAssignedTo" class="bg-black/40 border border-white/10 rounded p-3 text-white">
 <option value="">Assign Asset</option><option value="JARVIS">JARVIS</option><option value="JADE">JADE</option><option value="K3n">K3n</option>
 </select>
 <input type="text" id="editTags" class="bg-black/40 border border-white/10 rounded p-3 text-white" placeholder="tag1, tag2">
 </div>
 </div>
 <div class="flex justify-between mt-8">
 <button onclick="deleteTask()" class="text-red-500 font-bold uppercase text-xs">Terminate</button>
 <div class="flex gap-4">
 <button onclick="closeEditModal()" class="text-gray-400">Exit</button>
 <button onclick="saveTaskEdit()" class="bg-cyan-600 px-6 py-2 rounded font-bold text-white">PUSH TRUTH</button>
 </div>
 </div>
 </div>
 </div>

<script>
 const statusMap = { 'INBOX': 'todo', 'ASSIGNED': 'assigned', 'IN PROGRESS': 'in_progress', 'REVIEW': 'review', 'DONE': 'done' };
 const COLUMNS = ['todo', 'assigned', 'in_progress', 'review', 'done'];
 const COL_LABELS = { 'todo': 'INBOX', 'assigned': 'ASSIGNED', 'in_progress': 'IN PROGRESS', 'review': 'REVIEW', 'done': 'DONE' };
 const supabaseUrl = 'https://ljoiifswtizxhtwtilkf.supabase.co', supabaseKey = 'sb_publishable_wICRlh3baVhWG9Lqw4u1Zg_ADbfIMtm';
 
 let supabaseClient, tasks = [], manualLock = false;

 function renderBoard() {
 const board = document.getElementById('board');
 board.innerHTML = COLUMNS.map(col => `
 <div class="column glass rounded-lg">
 <div class="flex justify-between items-center mb-4">
 <span class="text-[10px] font-bold tracking-widest text-cyan-500 uppercase">${COL_LABELS[col]}</span>
 <button onclick="createNewTask('${col}')" class="text-gray-400 hover:text-white font-bold">+</button>
 </div>
 <div class="flex-1 min-h-[300px]" id="col-${col}" ondragover="event.preventDefault()" ondrop="drop(event)">
 ${tasks.filter(t => statusMap[t.status?.toUpperCase()] === col).map(t => `
 <div class="card" draggable="true" ondragstart="drag(event)" data-id="${t.id}" onclick="openEditModal('${t.id}')">
 ${t.assigned_agent ? `<span class="agent-badge">${t.assigned_agent}</span>` : ''}
 <div class="text-sm font-semibold">${t.content || 'Untitled'}</div>
 <div class="flex flex-wrap mt-2">${(t.tags || []).map(tag => `<span class="tag-pill">${tag}</span>`).join('')}</div>
 </div>
 `).join('')}
 </div>
 </div>
 `).join('');
 }

 async function init() {
 if (!window.supabase) { setTimeout(init, 250); return; }
 supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
 await fetchLatest();
 supabaseClient.channel('tasks-channel').on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, () => { if (!manualLock) fetchLatest(); }).subscribe();
 }

 async function fetchLatest() {
 try {
 const res = await fetch('/api/tasks');
 tasks = await res.json();
 renderBoard();
 } catch (e) { console.error("Fetch Failure", e); }
 }

 function drag(e) { e.dataTransfer.setData("text", e.target.dataset.id); }
 async function drop(e) {
 e.preventDefault();
 const id = e.dataTransfer.getData("text"), col = e.target.closest('[id^="col-"]').id.replace('col-', '');
 const t = tasks.find(x => x.id === id);
 if (t) {
 t.status = Object.keys(statusMap).find(key => statusMap[key] === col);
 renderBoard();
 await pushTruth();
 }
 }

 async function createNewTask(col) {
 const newTask = { id: Date.now().toString(), content: 'NEW OBJECTIVE', status: Object.keys(statusMap).find(key => statusMap[key] === col), description: '', assigned_agent: '', tags: [] };
 tasks.push(newTask);
 renderBoard();
 await pushTruth();
 openEditModal(newTask.id);
 }

 async function pushTruth() {
 manualLock = true;
 try {
 const res = await fetch('/api/tasks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tasks }) });
 if (res.ok) await fetchLatest();
 setTimeout(() => manualLock = false, 2000);
 } catch (e) { manualLock = false; }
 }

 function openEditModal(id) {
 const t = tasks.find(x => x.id === id); if (!t) return;
 document.getElementById('editTaskId').value = t.id;
 document.getElementById('editTitle').value = t.content;
 document.getElementById('editDescription').value = t.description;
 document.getElementById('editAssignedTo').value = t.assigned_agent;
 document.getElementById('editTags').value = (t.tags || []).join(', ');
 document.getElementById('editModal').style.display = 'flex';
 }
 function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }
 async function saveTaskEdit() {
 const id = document.getElementById('editTaskId').value, t = tasks.find(x => x.id === id);
 if (t) {
 t.content = document.getElementById('editTitle').value;
 t.description = document.getElementById('editDescription').value;
 t.assigned_agent = document.getElementById('editAssignedTo').value;
 t.tags = document.getElementById('editTags').value.split(',').map(s => s.trim()).filter(s => s);
 renderBoard();
 await pushTruth();
 }
 closeEditModal();
 }

 async function deleteTask() {
 const id = document.getElementById('editTaskId').value;
 if (confirm("TERMINATE MISSION?")) {
 await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
 tasks = tasks.filter(x => x.id !== id);
 renderBoard(); closeEditModal();
 }
 }
 init();
 </script>
</body>
</html>
