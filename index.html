<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Control</title>
  <script src="https://cdn.tailwindcss.com">// Initialize both (realtime first to start listening before data loads)
initRealtime();
init();
</script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0a0a0b;
      background-image: url('https://images.unsplash.com/photo-1464039397811-e7aec7d3a299?auto=format&fit=crop&w=1920&q=80'); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .glass {
      background: rgba(15, 15, 17, 0.85);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .card {
      background: rgba(30, 30, 35, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 0.5rem;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border-color: rgba(6, 182, 212, 0.3);
    }
    .card.dragging {
      opacity: 0.5;
    }
    .columns-container {
      display: flex;
      gap: 1.25rem;
      align-items: stretch;
      height: 100%;
    }
    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 300px;
    }
    .column-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding-bottom: 2rem;
    }
    .agent-badge {
      background: rgba(6, 182, 212, 0.15);
      color: #22d3ee;
      border: 1px solid rgba(6, 182, 212, 0.3);
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 0.25rem;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.025em;
    }
    .tag-pill {
      background: rgba(255, 255, 255, 0.05);
      color: #94a3b8;
      font-size: 0.65rem;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      margin-right: 0.35rem;
      display: inline-block;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .modal-backdrop {
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body class="text-gray-200">

  <header class="glass p-4 flex justify-between items-center sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-cyan-600 rounded flex items-center justify-center font-bold text-black shadow-[0_0_15px_rgba(8,145,178,0.4)]">J</div>
      <div>
        <h1 class="text-xl font-bold tracking-tight text-white">MISSION CONTROL</h1>
        <p class="text-[10px] text-cyan-500 font-mono tracking-[0.2em] uppercase">System Live</p>
      </div>
    </div>
    <div class="flex gap-3">
      <button onclick="openSettingsModal()" class="px-4 py-2 glass hover:bg-gray-800 rounded-md text-sm font-medium transition flex items-center gap-2">
        <span>⚙️</span> Settings
      </button>
    </div>
  </header>

  <main class="p-6 h-[calc(100vh-88px)] overflow-x-auto">
    <div id="board" class="columns-container h-full"></div>
  </main>

  <div id="settingsModal" class="fixed inset-0 modal-backdrop hidden items-center justify-center z-50">
    <div class="glass rounded-xl p-8 w-[450px] max-w-full shadow-2xl">
      <h2 class="text-xl font-bold mb-2 text-white">Dashboard Settings</h2>
      <p class="text-xs text-gray-400 mb-6 uppercase tracking-widest">Configuration / Column Mapping</p>
      <div id="columnSettings" class="space-y-4 mb-8"></div>
      <div class="flex justify-end gap-3">
        <button onclick="closeSettingsModal()" class="px-5 py-2.5 bg-transparent hover:text-white transition text-sm font-medium text-gray-400">Discard</button>
        <button onclick="saveSettings()" class="px-6 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-md text-sm font-bold transition shadow-lg shadow-cyan-900/20">Commit Changes</button>
      </div>
    </div>
  </div>

  <div id="editModal" class="fixed inset-0 modal-backdrop hidden items-center justify-center z-50">
    <div class="glass rounded-xl p-8 w-[520px] max-w-full shadow-2xl">
      <h2 class="text-xl font-bold mb-2 text-white">Task Protocol</h2>
      <p class="text-xs text-gray-400 mb-6 uppercase tracking-widest">Editor / Metadata Update</p>
      <input type="hidden" id="editTaskId">
      <div class="space-y-5">
        <div>
          <label class="block text-[10px] font-bold text-cyan-500 uppercase tracking-widest mb-1.5">Objective Title</label>
          <input type="text" id="editTitle" class="w-full bg-black/40 border border-white/10 rounded-md px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 transition">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-cyan-500 uppercase tracking-widest mb-1.5">Briefing / Description</label>
          <textarea id="editDescription" rows="4" class="w-full bg-black/40 border border-white/10 rounded-md px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 transition"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] font-bold text-cyan-500 uppercase tracking-widest mb-1.5">Asset Assigned</label>
            <select id="editAssignedTo" class="w-full bg-black/40 border border-white/10 rounded-md px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 transition">
              <option value="">None</option>
              <option value="JARVIS">JARVIS</option>
              <option value="K3n">K3n</option>
              <option value="Rookie">Rookie</option>
              <option value="Raccoon">Raccoon</option>
            </select>
          </div>
          <div>
            <label class="block text-[10px] font-bold text-cyan-500 uppercase tracking-widest mb-1.5">Identifiers (Tags)</label>
            <input type="text" id="editTags" class="w-full bg-black/40 border border-white/10 rounded-md px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 transition" placeholder="tag1, tag2">
          </div>
        </div>
      </div>
      <div class="flex justify-between mt-10">
        <button onclick="deleteTask()" class="px-5 py-2.5 bg-red-950/40 text-red-400 hover:bg-red-900/60 border border-red-900/30 rounded-md text-xs font-bold transition">TERMINATE TASK</button>
        <div class="flex gap-3">
          <button onclick="closeEditModal()" class="px-5 py-2.5 text-sm font-medium text-gray-400 hover:text-white transition">Exit</button>
          <button onclick="saveTaskEdit()" class="px-6 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-md text-sm font-bold transition">Update System</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_TASKS_KEY = 'missionControlTasks';
    const STORAGE_COLUMNS_KEY = 'missionControlColumns';
    const DEFAULT_COLUMNS = ['todo', 'assigned', 'in_progress', 'review', 'done'];
    const displayNames = { 'todo': 'INBOX', 'assigned': 'ASSIGNED', 'in_progress': 'IN PROGRESS', 'review': 'REVIEW', 'done': 'DONE' };

    let tasks = [];
    let columnNames = [];

    let realtimeSubscribed = false;
  function initRealtime() {
    console.log('DEBUG: Attempting Supabase connection...');
    if (realtimeSubscribed) return; // Prevent multiple subscriptions
    realtimeSubscribed = true;
    const supabaseUrl = 'https://ljoiifswtizxhtwtilkf.supabase.co';
    const supabaseKey = 'sb_publishable_wICRlh3baVhWG9Lqw4u1Zg_ADbfIMtm';
    const supabase = window.Supabase.createClient(supabaseUrl, supabaseKey);
    
    // Subscribe to all changes on tasks table
    supabase
      .channel('tasks')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, (payload) => {
        console.log('Postgres change received!', payload);
        console.log('Realtime Update Received:', payload);
        
        const { eventType, new: newRecord, old: oldRecord } = payload;
        
        if (eventType === 'INSERT') {
          // Add new task to appropriate column
          const col = newRecord.status?.toLowerCase() || 'todo';
          if (!tasks.find(t => t.id === newRecord.id)) {
            tasks.push({ id: newRecord.id, task_name: newRecord.content,
          tags: newRecord.tags || [], column: col, priority: newRecord.priority });
          }
        } else if (eventType === 'UPDATE') {
          // Update existing task
          const idx = tasks.findIndex(t => t.id === newRecord.id);
          if (idx !== -1) {
            tasks[idx].title = newRecord.content;
            tasks[idx].column = newRecord.status?.toLowerCase() || 'todo';
            tasks[idx].priority = newRecord.priority;
          }
        } else if (eventType === 'DELETE') {
          // Remove deleted task
          tasks = tasks.filter(t => t.id !== oldRecord.id);
        }
        
        renderBoard();
      })
      .subscribe();
    console.log('Subscribed to Supabase realtime');
  }

  async function init() {
    

        localStorage.clear();
      // Load columns from LocalStorage as usual
      const savedColumns = localStorage.getItem(STORAGE_COLUMNS_KEY);
      columnNames = savedColumns ? JSON.parse(savedColumns) : [...DEFAULT_COLUMNS];
      if (!savedColumns) saveColumns();

      try {
        // FETCH from Redis-backed API
        const response = await fetch('/api/tasks');
        const data = await response.json();

        // Mapping: Convert nested JSON (Columns as keys) into a flat array for the UI
        tasks = Object.keys(data).flatMap(colName => 
          data[colName].map(task => ({
            ...task,
            id: task.id.toString(),
            title: task.task_name, // Map task_name to title
            description: task.description || '',
            assignedTo: task.assigned_agent || '', // Map assigned_agent to assignedTo
            tags: task.tags || [],
            column: colName // The key name (e.g. "INBOX") becomes the column property
          }))
        );

        console.log("System Live: Syncing with Supabase");
        renderBoard();
      } catch (error) {
        console.error("Critical: Could not sync with tasks.json. Check file permissions.", error);
        // Fallback to empty board if fetch fails
        renderBoard();
      }
    }

    function saveTasks() { 
      localStorage.setItem(STORAGE_TASKS_KEY, JSON.stringify(tasks)); 
      
      // Also save to server
      fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tasks, columns: columnNames })
      }).then(res => res.json()).then(data => {
        console.log('Tasks saved to server:', data);
      }).catch(err => {
        console.error('Failed to save to server:', err);
      });
    }
    function saveColumns() { localStorage.setItem(STORAGE_COLUMNS_KEY, JSON.stringify(columnNames)); }

    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      columnNames.forEach(col => {
        const colDiv = document.createElement('div');
        colDiv.className = 'column glass rounded-lg p-4 flex flex-col';
        colDiv.innerHTML = `
<div class="flex justify-between items-center mb-5">
            <h3 class="font-bold text-white text-xs uppercase tracking-[0.2em] opacity-80">${displayNames[col] || col}</h3>
            <span class="text-[10px] font-mono text-gray-500">${tasks.filter(t => t.column === col).length}</span>
            <button onclick="createNewTask('${col}')" class="text-gray-400 hover:text-white text-lg font-bold">+</button>
          </div>
          </div>
          <div class="column-body" data-column="${col}" ondragover="allowDrop(event)" ondrop="drop(event)">
            ${tasks.filter(t => t.column === col).map(t => renderTask(t)).join('')}
          </div>
        `;
        board.appendChild(colDiv);
      });
      attachDragEvents();
    }

    function renderTask(task) {
      const tagsHtml = (task.tags || []).map(tag => `<span class="tag-pill">${tag}</span>`).join('');
      const badgeHtml = task.assignedTo ? `<span class="agent-badge">${task.assignedTo}</span>` : '';
      return `
        <div class="card p-4 cursor-grab active:cursor-grabbing" draggable="true" data-id="${task.id}" onclick="openEditModal('${task.id}')">
          ${badgeHtml}
          <div class="font-semibold text-sm text-gray-100 mb-2 leading-tight">${escapeHtml(task.task_name)}</div>
          <div class="flex flex-wrap gap-1 mb-3">${tagsHtml}</div>
          ${task.description ? `<div class="text-[11px] text-gray-500 line-clamp-2 font-medium">${escapeHtml(task.description)}</div>` : ''}
        </div>
      `;
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function attachDragEvents() {
      document.querySelectorAll('.card[draggable="true"]').forEach(card => {
        card.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', e.target.dataset.id);
          e.target.classList.add('dragging');
        });
        card.addEventListener('dragend', (e) => e.target.classList.remove('dragging'));
      });
    }

    function allowDrop(e) { e.preventDefault(); }
    function drop(e) {
      e.preventDefault();
      const taskId = e.dataTransfer.getData('text/plain');
      const colBody = e.target.closest('.column-body');
      if (!colBody) return;
      const newColumn = colBody.dataset.column;
      const task = tasks.find(t => t.id === taskId);
      if (task && task.column !== newColumn) {
        task.column = newColumn;
        saveTasks();
        renderBoard();
      }
    }

    function openSettingsModal() {
      const container = document.getElementById('columnSettings');
      container.innerHTML = columnNames.map((name, idx) => `
        <div>
          <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1 block">Slot ${idx + 1}</label>
          <input type="text" value="${escapeHtml(name)}" data-idx="${idx}" class="w-full bg-black/40 border border-white/10 rounded px-3 py-2 text-sm focus:outline-none focus:border-cyan-500">
        </div>
      `).join('');
      document.getElementById('settingsModal').classList.replace('hidden', 'flex');
    }

    function closeSettingsModal() { document.getElementById('settingsModal').classList.replace('flex', 'hidden'); }
    
    function saveSettings() {
      const inputs = document.querySelectorAll('#columnSettings input');
      const oldNames = [...columnNames];
      columnNames = Array.from(inputs).map(input => input.value.trim() || 'Uninitialized');
      tasks.forEach(task => {
        const oldIdx = oldNames.indexOf(task.column);
        if (oldIdx !== -1) task.column = columnNames[oldIdx];
      });
      saveColumns();
      saveTasks();
      renderBoard();
      closeSettingsModal();
    }

    function createNewTask(columnName) {
      const newTask = {
        id: String(Date.now()),
        title: 'New Task',
        description: '',
        assignedTo: '',
        tags: [],
        column: columnName
      };
      tasks.push(newTask);
      saveTasks();
      renderBoard();
      setTimeout(() => openEditModal(newTask.id), 50);
    }

    function openEditModal(taskId) {
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;
      document.getElementById('editTaskId').value = task.id;
      document.getElementById('editTitle').value = task.task_name;
      document.getElementById('editDescription').value = task.description || '';
      document.getElementById('editAssignedTo').value = task.assignedTo || '';
      document.getElementById('editTags').value = (task.tags || []).join(', ');
      document.getElementById('editModal').classList.replace('hidden', 'flex');
    }

    function closeEditModal() { document.getElementById('editModal').classList.replace('flex', 'hidden'); }

    function saveTaskEdit() {
      const id = document.getElementById('editTaskId').value;
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      task.task_name = document.getElementById('editTitle').value.trim() || 'New Task';
      task.description = document.getElementById('editDescription').value.trim();
      task.assignedTo = document.getElementById('editAssignedTo').value;
      const tagsStr = document.getElementById('editTags').value;
      task.tags = tagsStr ? tagsStr.split(',').map(t => t.trim()).filter(t => t) : [];
      saveTasks();
      renderBoard();
      closeEditModal();
    }

    function deleteTask() {
      const id = document.getElementById('editTaskId').value;
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderBoard();
      closeEditModal();
    }

  </script>
  <!-- Edit Task Modal -->
  <div id="editModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50">
    <div class="bg-gray-800 rounded-lg p-4 w-96 border border-gray-600">
      <h3 class="text-white text-sm font-semibold mb-3">Edit Task</h3>
      <input type="hidden" id="editTaskId">
      <div class="space-y-3">
        <input type="text" id="editTitle" placeholder="Task title" class="w-full bg-gray-700 text-white rounded px-3 py-2 text-sm focus:outline-none focus:border-cyan-500">
        <textarea id="editDescription" placeholder="Description" rows="2" class="w-full bg-gray-700 text-white rounded px-3 py-2 text-sm focus:outline-none focus:border-cyan-500"></textarea>
        <select id="editAssignedTo" class="w-full bg-gray-700 text-white rounded px-3 py-2 text-sm focus:outline-none focus:border-cyan-500">
          <option value="">Unassigned</option>
          <option value="JARVIS">JARVIS</option>
          <option value="JADE">JADE</option>
          <option value="BLAZE">BLAZE</option>
          <option value="NOVA">NOVA</option>
          <option value="SAGE">SAGE</option>
          <option value="AXEL">AXEL</option>
        </select>
        <input type="text" id="editTags" placeholder="Tags (comma separated)" class="w-full bg-gray-700 text-white rounded px-3 py-2 text-sm focus:outline-none focus:border-cyan-500">
      </div>
      <div class="flex justify-between mt-4">
        <button onclick="deleteTask()" class="px-3 py-1.5 bg-red-700 hover:bg-red-600 text-white rounded text-xs">Delete</button>
        <div class="flex gap-2">
          <button onclick="closeEditModal()" class="px-3 py-1.5 bg-gray-600 hover:bg-gray-500 text-white rounded text-xs">Cancel</button>
          <button onclick="saveTaskEdit()" class="px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded text-xs">Save</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
